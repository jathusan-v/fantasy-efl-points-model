[project]
name = "fantasy-efl-points-model"
version = "0.1.0"
description = "Walk-forward expected-points model for Fantasy EFL using Poisson component models"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Jathusan Vijayakumar", email = "jathusan.vk@gmail.com" }
]
requires-python = ">=3.13"
dependencies = []

[project.urls]
Repository = "https://github.com/jathusan-v/fantasy-efl-points-model"

[build-system]
requires = ["uv_build>=0.12.24,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "efl_points"

[dependency-groups]
dev = [
    "hypothesis>=6.168.5",
    "mypy>=2.4.0",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle: basic style errors
    "F",        # pyflakes: unused imports, undefined names (real bugs)
    "I",        # isort: import ordering
    "B",        # bugbear: likely bugs, e.g. mutable default arguments
    "UP",       # pyupgrade: modern syntax for your Python version
    "N",        # pep8-naming: snake_case / PascalCase conventions
    "D",        # pydocstyle: docstrings on every public function
    "SIM",      # simplifications
    "C4",       # cleaner comprehensions
    "PT",       # pytest style
    "NPY",      # NumPy: e.g. legacy np.random.seed instead of Generator
    "A",        # shadowing builtins/stdlib (would have caught calendar.py)
    "DTZ",      # timezone-naive datetimes
    "RUF",      # ruff-specific checks
]
ignore = [
    "W191", "D206", "D300",   # conflict with the formatter (per ruff docs)
]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D1"]   # tests need clear names, not docstrings

[tool.ruff.format]
docstring-code-format = true

[tool.mypy]
strict = true
warn_unreachable = true
files = ["src"]

[project]
name = "fantasy-efl-points-model"
version = "0.1.0"
description = "Walk-forward expected-points model for Fantasy EFL using Poisson component models"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Jathusan Vijayakumar", email = "jathusan.vk@gmail.com" }
]
requires-python = ">=3.13"
dependencies = []

[project.urls]
Repository = "https://github.com/jathusan-v/fantasy-efl-points-model"

[build-system]
requires = ["uv_build>=0.12.24,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "efl_points"

[dependency-groups]
dev = [
    "hypothesis>=6.168.5",
    "mypy>=2.4.0",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]
